name: App checks and Pages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: map-work/*.pmtiles
          key: washington-20260912-pmtiles-1.31.2
      - name: Install pinned map extraction tool
        run: |
          mkdir -p map-work/tool
          curl --fail --location https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz -o map-work/tool/pmtiles.tar.gz
          echo '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  map-work/tool/pmtiles.tar.gz' | sha256sum --check
          tar -xzf map-work/tool/pmtiles.tar.gz -C map-work/tool
      - run: npm run map:prepare
        env:
          PMTILES_CLI: ./map-work/tool/pmtiles
          MAP_ARCHIVE_URL: ${{ vars.MAP_ARCHIVE_URL }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:data
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build
        env:
          BASE_PATH: /fly-washington/
      - uses: actions/upload-artifact@v4
        with:
          name: washington-map-20260912-z12
          path: public/maps/20260912-z12/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
